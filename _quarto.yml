  title: "Youssef Kharchouf"
  google-analytics: "G-NMTV7Y60PQ"
  comments:
    giscus:
      repo: nightowl97/personal_blog
      repo-id: R_kgDOSZBZHA
      category: Comments
      category-id: DIC_kwDOSZBZHM4C-T4j
      mapping: pathname
      reactions-enabled: true
      loading: lazy
      theme: gruvbox_dark
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/nightowl97
      - icon: linkedin
        href: https://www.linkedin.com/in/youssefkhar/
      - icon: bi-mortarboard-fill
        href: https://scholar.google.com/citations?user=rjjVxSYAAAAJ
format:
  html:
    theme:
      - flatly 
      - customtheme.scss
    css: styles.css
    fontsize: 1.0em
    highlight-style: gruvbox
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"
    include-in-header:
      - mathjax-config.html
      - head-favicons.html
    
