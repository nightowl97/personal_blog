<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Errachidia live</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<style>
  :root {
    --line:     #B8693C;
    --line-rgb: 184,105,60;
    --ink:      #F2EDE4;
    --paper:    #2C2926;
    --surface:  #1E1C1A;
    --border:   #3D3830;
    --muted:    #5C5450;
    --sub:      #ABA49A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #wrap { position: relative; height: 100%; min-height: 420px; }
  #map  { position: absolute; inset: 0; }

  /* ── status pill ── */
  #status {
    position: absolute; z-index: 1000; top: 12px; right: 12px;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
    font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  #status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--line);
    animation: pill-pulse 2s infinite;
  }
  #status.stale .dot { background: var(--muted); animation: none; }
  #status .sep { color: var(--border); }
  @keyframes pill-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(var(--line-rgb),.55); }
    50%      { box-shadow: 0 0 0 5px rgba(var(--line-rgb),0);  }
  }

  /* ── stop markers ── */
  .stop-pin {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--lc, var(--sub));
    box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  .stop-pin.terminus {
    width: 14px; height: 14px;
    border-width: 2.5px;
    background: var(--lc, var(--line));
    border-color: var(--ink);
  }

  /* ── live bus marker ── */
  .bus-wrap {
    position: relative;
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
  }
  .bus-ring {
    position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%;
    animation: bus-ripple 2s ease-out infinite;
  }
  .bus-ring:nth-child(2) { animation-delay: .7s; }
  .bus-core {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--ink);
    position: relative; z-index: 2;
  }
  @keyframes bus-ripple {
    0%   { transform: scale(1);   opacity: .75; }
    100% { transform: scale(4.2); opacity: 0;   }
  }

  /* ── popups ── */
  .leaflet-popup-content-wrapper,
  .leaflet-popup-tip {
    background: var(--paper) !important;
    color: var(--ink) !important;
    box-shadow: 0 3px 12px rgba(0,0,0,.5) !important;
    border: 1px solid var(--border);
  }
  .leaflet-popup-close-button { color: var(--sub) !important; }
  .leaflet-popup-close-button:hover { color: var(--ink) !important; }
  .leaflet-popup-content {
    font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
    margin: 10px 14px;
  }
  .leaflet-popup-content .name  { font-weight: 700; font-size: 13px; color: var(--ink); }
  .leaflet-popup-content .meta  { color: var(--sub); font-size: 11px; margin-top: 2px; }
  .leaflet-popup-content .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    color: var(--ink); font-size: 11px; font-weight: 600;
    margin-top: 4px;
  }

  /* ── zoom controls ── */
  .leaflet-control-zoom a {
    background: var(--paper) !important;
    color: var(--sub) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-zoom a:hover {
    background: var(--border) !important;
    color: var(--ink) !important;
  }

  /* ── attribution ── */
  .leaflet-control-attribution {
    background: rgba(30,28,26,.85) !important;
    color: var(--muted) !important;
  }
  .leaflet-control-attribution a { color: var(--sub) !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="status"><span class="dot"></span><span id="status-text">starting…</span></div>
  <div id="map"></div>
</div>

<script>
const REFRESH_MS = 10000;

// --- geometry ---

function extractPoints(gj) {
  const pts = [];
  const pushLine = coords => {
    for (const [lng, lat] of coords) pts.push({ lat, lng });
  };
  const walk = g => {
    if (!g) return;
    if (g.type === "LineString")        pushLine(g.coordinates);
    if (g.type === "MultiLineString")   g.coordinates.forEach(pushLine);
    if (g.type === "Feature")           walk(g.geometry);
    if (g.type === "FeatureCollection") g.features.forEach(walk);
  };
  walk(gj);
  return pts;
}

function snapToLine(pts, lat, lng) {
  if (!pts || pts.length < 2) return { lat, lng, segIdx: 0 };
  let best = { lat, lng, segIdx: 0 };
  let minD2 = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const A = pts[i], B = pts[i + 1];
    const abLat = B.lat - A.lat,  abLng = B.lng - A.lng;
    const apLat = lat  - A.lat,   apLng = lng  - A.lng;
    const ab2 = abLat * abLat + abLng * abLng;
    if (ab2 === 0) continue;
    const t = Math.max(0, Math.min(1, (apLat * abLat + apLng * abLng) / ab2));
    const pLat = A.lat + t * abLat;
    const pLng = A.lng + t * abLng;
    const d2 = (lat - pLat) ** 2 + (lng - pLng) ** 2;
    if (d2 < minD2) { minD2 = d2; best = { lat: pLat, lng: pLng, segIdx: i }; }
  }
  return best;
}

// --- init ---

(async () => {
  const params  = new URLSearchParams(location.search);
  const lineIds = (params.get('lines') || params.get('line') || 'l01,l02,l03')
                    .split(',').map(s => s.trim());
  const LINES   = (await Promise.all(
    lineIds.map(id => fetch(`lines/${id}.json`).then(r => r.json()).catch(() => null))
  )).filter(Boolean);

  if (LINES.length === 1) {
    document.title = `${LINES[0].name} — Errachidia live`;
    document.documentElement.style.setProperty('--line',     LINES[0].color);
    document.documentElement.style.setProperty('--line-rgb', LINES[0].colorRgb);
  }

  // --- map ---

  const map = L.map("map", { zoomControl: true, attributionControl: false });
  L.control.attribution({ prefix: false }).addTo(map);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);

  function routeStyle(weight, opacity, color) {
    return { color, weight, opacity, lineCap: "round", lineJoin: "round" };
  }

  // --- selection: click a bus or route to highlight, map click to reset ---

  // routeLayers[lineId][dir] = [shadowLayer, colorLayer]
  const routeLayers   = {};
  let   highlightLayers = [];   // split polylines created on bus click, removed on reset
  let   activeSelection = null; // { busKey, lineId } of the currently highlighted bus

  function ptsToLatLng(pts) { return pts.map(p => [p.lat, p.lng]); }

  function selectLine(lineId, dir, busPos) {
    // clear any existing split highlight
    highlightLayers.forEach(l => map.removeLayer(l));
    highlightLayers = [];

    for (const LINE of LINES) {
      const dirs = routeLayers[LINE.id] ?? {};

      if (LINE.id === lineId) {
        if (dir && busPos != null) {
          // hide the stored GeoJSON layers for this line — replaced by split polylines
          for (const d of ['aller', 'retour']) {
            const [s, r] = dirs[d] ?? [];
            if (s) s.setStyle({ opacity: 0 });
            if (r) r.setStyle({ opacity: 0 });
          }

          // active direction: split at bus position into traveled (muted) + remaining (full)
          const pts = routePts[LINE.id]?.[dir];
          if (pts?.length >= 2) {
            const idx  = Math.max(0, Math.min(busPos.segIdx, pts.length - 2));
            const past   = ptsToLatLng(pts.slice(0, idx + 1));
            const future = ptsToLatLng(pts.slice(idx));
            if (past.length   >= 2) highlightLayers.push(
              L.polyline(past, routeStyle(12, 0.08, "#3D3830")).addTo(map),
              L.polyline(past, routeStyle(7,  0.25, LINE.color)).addTo(map)
            );
            if (future.length >= 2) highlightLayers.push(
              L.polyline(future, routeStyle(12, 0.25, "#3D3830")).addTo(map),
              L.polyline(future, routeStyle(7,  0.90, LINE.color)).addTo(map)
            );
          }

          // opposite direction: draw muted so the route shape is still legible
          const opp    = dir === 'aller' ? 'retour' : 'aller';
          const oppPts = routePts[LINE.id]?.[opp];
          if (oppPts?.length >= 2) highlightLayers.push(
            L.polyline(ptsToLatLng(oppPts), routeStyle(12, 0.05, "#3D3830")).addTo(map),
            L.polyline(ptsToLatLng(oppPts), routeStyle(7,  0.20, LINE.color)).addTo(map)
          );
        } else {
          // route clicked (no bus): just bring aller to front at full opacity
          const [as_, ar] = dirs['aller'] ?? [];
          if (as_) { as_.setStyle({ opacity: 0.25 }); as_.bringToFront(); }
          if (ar)  { ar.setStyle({ opacity: 0.90 });  ar.bringToFront();  }
        }
      } else {
        // dim other lines' routes and buses, keep their retour hidden
        const [as_, ar] = dirs['aller'] ?? [];
        if (as_) as_.setStyle({ opacity: 0.06 });
        if (ar)  ar.setStyle({ opacity: 0.20 });
        const [rs, rr] = dirs['retour'] ?? [];
        if (rs) rs.setStyle({ opacity: 0 });
        if (rr) rr.setStyle({ opacity: 0 });
        for (const [key, m] of busMarkers) {
          if (key.startsWith(`${LINE.id}:`)) m.setOpacity(0.25);
        }
      }
    }
    // restore selected line's bus markers to full opacity
    for (const [key, m] of busMarkers) {
      if (key.startsWith(`${lineId}:`)) m.setOpacity(1);
    }
  }

  function resetSelection() {
    activeSelection = null;
    highlightLayers.forEach(l => map.removeLayer(l));
    highlightLayers = [];
    for (const [, m] of busMarkers) m.setOpacity(1);
    for (const LINE of LINES) {
      const dirs = routeLayers[LINE.id] ?? {};
      const [as_, ar] = dirs['aller'] ?? [];
      if (as_) as_.setStyle({ opacity: 0.25 });
      if (ar)  ar.setStyle({ opacity: 0.90 });
      const [rs, rr] = dirs['retour'] ?? [];
      if (rs) rs.setStyle({ opacity: 0 });
      if (rr) rr.setStyle({ opacity: 0 });
    }
  }

  map.on('click', resetSelection);

  const busMarkers = new Map();

  // --- routes & stops ---

  const routePts = {};

  const stationsData = await fetch('stations.json').then(r => r.json()).catch(() => []);
  const stationPos   = new Map(stationsData.map(s => [s.name, s]));
  const stationLines = new Map();
  for (const LINE of LINES) {
    for (const name of LINE.stations ?? []) {
      if (!stationLines.has(name)) stationLines.set(name, []);
      stationLines.get(name).push(LINE);
    }
  }

  await Promise.all(LINES.map(async LINE => {
    routePts[LINE.id] = { aller: null, retour: null };
    routeLayers[LINE.id] = {};

    const placeholder = L.layerGroup().addTo(map);
    const names  = LINE.stations ?? [];
    const coords = names.map(n => stationPos.get(n)).filter(Boolean).map(s => [s.lat, s.lng]);
    if (coords.length) {
      L.polyline(coords, {
        color: LINE.color, weight: 4, opacity: .3, dashArray: "8 10", lineCap: "round",
      }).addTo(placeholder);
    }

    await Promise.all([['aller', LINE.allerUrl], ['retour', LINE.retourUrl]].map(async ([dir, url]) => {
      try {
        const r = await fetch(url);
        if (!r.ok) return;
        const gj = await r.json();
        routePts[LINE.id][dir] = extractPoints(gj);
        if (dir === 'aller') placeholder.clearLayers();
        const initOpacity       = dir === 'aller' ? 0.90 : 0;
        const initShadowOpacity = dir === 'aller' ? 0.25 : 0;
        const shadow = L.geoJSON(gj, { style: routeStyle(12, initShadowOpacity, "#3D3830") }).addTo(map);
        const route  = L.geoJSON(gj, { style: routeStyle(7,  initOpacity, LINE.color) }).addTo(map);
        route.on('click', e => { L.DomEvent.stopPropagation(e); selectLine(LINE.id, null); });
        routeLayers[LINE.id][dir] = [shadow, route];
      } catch {}
    }));
  }));

  const stopGroup = L.featureGroup().addTo(map);
  for (const [name, servingLines] of stationLines) {
    const pos = stationPos.get(name);
    if (!pos) continue;
    const terminusFor = servingLines.filter(LINE => {
      const s = LINE.stations;
      return s[0] === name || s[s.length - 1] === name;
    });
    const isTerminus = terminusFor.length > 0;
    const size = isTerminus ? 14 : 10;
    const icon = L.divIcon({
      className: "",
      html: `<div class="stop-pin${isTerminus ? " terminus" : ""}"></div>`,
      iconSize:   [size, size],
      iconAnchor: [size / 2, size / 2],
    });
    const linesBadges   = servingLines.map(LINE =>
      `<span class="badge" style="background:${LINE.color}">${LINE.name}</span>`).join(" ");
    const terminusBadge = terminusFor.map(LINE =>
      `<span class="badge" style="background:${LINE.color}">${LINE.name} terminus</span>`).join(" ");
    L.marker([pos.lat, pos.lng], { icon })
      .bindPopup(`
        <div class="name">${name}</div>
        <div class="meta" style="margin-top:4px">${linesBadges}</div>
        ${terminusBadge ? `<div style="margin-top:4px">${terminusBadge}</div>` : ""}
      `)
      .addTo(stopGroup);
  }

  if (stopGroup.getLayers().length > 0) {
    map.fitBounds(stopGroup.getBounds().pad(0.08));
  }

  // --- live buses ---

  const sensDir = s => (s === 1 ? 'retour' : 'aller');

  function busIcon(color, colorRgb) {
    return L.divIcon({
      className: "",
      html: `<div class="bus-wrap">
               <div class="bus-ring" style="background:rgba(${colorRgb},.35)"></div>
               <div class="bus-ring" style="background:rgba(${colorRgb},.35)"></div>
               <div class="bus-core" style="border:3px solid ${color};box-shadow:0 0 0 1px rgba(${colorRgb},.4),0 2px 10px rgba(0,0,0,.6)"></div>
             </div>`,
      iconSize:   [56, 56],
      iconAnchor: [28, 28],
    });
  }

  function busPopup(b, LINE) {
    const dir = LINE.sensDirMap?.[b.sens] ?? `sens=${b.sens}`;
    return `<div class="name">${LINES.length > 1 ? LINE.name + ' · ' : ''}Bus ${b.bus}</div>
            <div class="meta">${dir}</div>
            <div class="meta">GPS: ${b.src_updated_at || "?"} UTC</div>`;
  }

  async function refresh() {
    let total = 0, anyErr = false;
    await Promise.all(LINES.map(async LINE => {
      if (!LINE.workerUrl) return;
      try {
        const res  = await fetch(LINE.workerUrl, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const snap  = await res.json();
        const valid = (snap.buses || []).filter(b => b.lat != null && b.lng != null);
        total += valid.length;

        const seen = new Set();
        valid.forEach(b => {
          const key = `${LINE.id}:${b.bus}`;
          seen.add(key);
          const dir = sensDir(b.sens);
          const pos = snapToLine(routePts[LINE.id]?.[dir], b.lat, b.lng);
          const ll  = L.latLng(pos.lat, pos.lng);

          if (busMarkers.has(key)) {
            const m = busMarkers.get(key);
            m.setLatLng(ll).setPopupContent(busPopup(b, LINE));
            m._busPos = pos;
            m._busDir = dir;
          } else {
            const m = L.marker(ll, { icon: busIcon(LINE.color, LINE.colorRgb), zIndexOffset: 1000 })
              .bindPopup(busPopup(b, LINE))
              .addTo(map);
            m._busPos = pos;
            m._busDir = dir;
            m.on('click', e => {
              L.DomEvent.stopPropagation(e);
              activeSelection = { busKey: key, lineId: LINE.id };
              selectLine(LINE.id, m._busDir, m._busPos);
            });
            busMarkers.set(key, m);
          }
        });

        for (const [key, m] of busMarkers) {
          if (key.startsWith(`${LINE.id}:`) && !seen.has(key)) { map.removeLayer(m); busMarkers.delete(key); }
        }
      } catch { anyErr = true; }
    }));
    // re-apply highlight with updated position if a bus is selected
    if (activeSelection) {
      const m = busMarkers.get(activeSelection.busKey);
      if (m) {
        selectLine(activeSelection.lineId, m._busDir, m._busPos);
      } else {
        resetSelection(); // bus left the feed
      }
    }

    setStatus(total, anyErr);
  }

  function setStatus(n, stale) {
    const el  = document.getElementById("status");
    const txt = document.getElementById("status-text");
    el.classList.toggle("stale", stale);
    const buses = n === 1 ? "1 bus" : `${n} buses`;
    txt.innerHTML = stale
      ? `no data <span class="sep">·</span> retrying`
      : `live <span class="sep">·</span> ${buses}`;
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
